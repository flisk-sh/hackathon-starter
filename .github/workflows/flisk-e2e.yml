name: Flisk e2e

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLISK_VERSION: '1.4.34'

jobs:
  flisk-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'npm'
      - run: npm install
      - run: npx playwright install --with-deps chromium

      - name: Start the stack with Flisk (MongoDB in Docker, app as a local process)
        run: |
          npx --yes @flisk-sh/flisk@${FLISK_VERSION} up > flisk-up.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && exit 0
            sleep 3
          done
          echo "App did not answer on http://localhost:8080/" >&2
          cat flisk-up.log
          exit 1

      - name: Run the e2e test
        run: npm run test:e2e:flisk

      - name: Show Flisk status and logs
        if: always()
        run: |
          npx --yes @flisk-sh/flisk@${FLISK_VERSION} status || true
          tail -n 200 flisk-up.log || true

      - name: Stop the stack
        if: always()
        run: npx --yes @flisk-sh/flisk@${FLISK_VERSION} down || true
